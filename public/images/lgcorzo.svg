<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sciphi-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#e879f9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring (Glowing) -->
  <circle cx="128" cy="128" r="96" stroke="url(#sciphi-grad)" stroke-width="10" fill="none" opacity="0.6" filter="url(#glow)"/>
  <circle cx="128" cy="128" r="96" stroke="white" stroke-width="2" fill="none" opacity="0.9"/>

  <!-- Inner Phi Symbol Circle -->
  <circle cx="128" cy="128" r="54" stroke="url(#sciphi-grad)" stroke-width="10" fill="none" opacity="0.8"/>
  <circle cx="128" cy="128" r="54" stroke="white" stroke-width="2" fill="none" opacity="0.9"/>

  <!-- Vertical line of Phi -->
  <line x1="128" y1="50" x2="128" y2="206" stroke="url(#sciphi-grad)" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
  <line x1="128" y1="50" x2="128" y2="206" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

  <!-- Dynamic swoosh / S shape to represent 'Sci' -->
  <path d="M 184 84 C 110 30, 70 110, 128 128 C 186 146, 146 226, 72 172" stroke="url(#sciphi-grad)" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.8" filter="url(#glow)"/>
  <path d="M 184 84 C 110 30, 70 110, 128 128 C 186 146, 146 226, 72 172" stroke="white" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- Glowing Core -->
  <circle cx="128" cy="128" r="8" fill="white" filter="url(#glow)"/>
</svg>
